services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Definir DB_DATABASE en .env}
      MYSQL_USER: ${DB_USERNAME:?Definir DB_USERNAME en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - drugstore_db:/var/lib/mysql
      - ./database/legacy-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - drugstore_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  drugstore_db:
  drugstore_redis:
